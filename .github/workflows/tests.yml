name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Secrets.kt is deliberately not in the repository. The example has empty
      # values, which is all the detection tests need: they never touch the network.
      - name: Create Secrets.kt from the example
        run: cp Secrets.kt.example app/src/main/java/com/omer/qaygisiz/Secrets.kt

      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew test --no-daemon

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/